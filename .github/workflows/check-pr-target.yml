name: Check PR target

# marketplace は配布専用。marketplace 宛ての Pull Request は失敗させ、main へ誘導する。
on:
  pull_request:
    branches: [marketplace]

permissions:
  contents: read

jobs:
  reject:
    runs-on: ubuntu-latest
    steps:
      - name: Reject pull requests targeting marketplace
        run: |
          echo "::error::marketplace は GitHub Actions が自動生成する配布専用ブランチです。Pull Request の宛先 (base) を main に変更してください。"
          exit 1
