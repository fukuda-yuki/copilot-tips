name: Check PR target

# main は配布専用。main 宛ての Pull Request は失敗させ、staged へ誘導する。
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  reject:
    runs-on: ubuntu-latest
    steps:
      - name: Reject pull requests targeting main
        run: |
          echo "::error::main は GitHub Actions が自動生成する配布専用ブランチです。Pull Request の宛先 (base) を staged に変更してください。"
          exit 1
