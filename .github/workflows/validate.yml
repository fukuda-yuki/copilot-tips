name: Validate

# main 宛ての Pull Request を検証する。
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # version の上げ忘れを main との差分で確認するため
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Validate catalog and version bumps
        run: npm run validate
      - name: Run tests
        run: npm test
      - name: Build distribution (dry run)
        run: npm run build
      - name: Check generated files are committed
        run: git diff --exit-code
