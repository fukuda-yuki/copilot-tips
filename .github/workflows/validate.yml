name: Validate

# main 宛ての Pull Request を検証する。
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # version の上げ忘れを main との差分で確認するため
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Validate catalog and version bumps
        run: npm run validate
      - name: Run tests
        run: npm test
      - name: Build distribution (dry run)
        run: npm run build
      - name: Check generated files are committed
        run: git diff --exit-code
